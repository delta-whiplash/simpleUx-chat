<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleUX · Luxury Mineral v2 · core screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0A0D13;
  --gold:#E2B755; --gold-deep:#D97706; --on-gold:#131720;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--page);
  font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;
  padding:44px 40px 56px;
  -webkit-font-smoothing:antialiased;
}
.board-title{color:#E7ECF4;font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;}
.board-sub{color:#8B95A7;font-size:13px;font-weight:500;margin-bottom:34px;}
.board{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;}
figure.device{display:flex;flex-direction:column;gap:12px;}
figcaption{color:#7E889B;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-align:center;}
.screen{
  width:400px;height:868px;border-radius:46px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;background:var(--canvas);
  outline:1px solid rgba(255,255,255,.10);
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.screen.light{outline-color:rgba(15,23,42,.14);box-shadow:0 30px 80px rgba(0,0,0,.35);}

/* ============ DARK TOKENS ============ */
.dark{
  --canvas:#0B0F17;
  --canvas-glow-a:rgba(226,183,85,.05);
  --canvas-glow-b:rgba(56,189,248,.04);
  --island-top:#141C2A; --island-bot:#101622;
  --card-top:#1B2434; --card-bot:#141B29;
  --in-bubble:#1A2130;
  --out-top:#2C4C78; --out-bot:#1E3557;
  --out-rim:rgba(255,255,255,.14);
  --in-rim:rgba(255,255,255,.07);
  --ink-1:#F8FAFC; --ink-2:#CBD5E1; --ink-3:#94A3B8; --ink-4:#64748B;
  --hairline:rgba(255,255,255,.07);
  --pill-bg:rgba(30,41,59,.45);
  --pill-active-bg:rgba(226,183,85,.13);
  --pill-active-border:rgba(226,183,85,.42);
  --pill-active-text:#E2B755;
  --badge-bg:linear-gradient(135deg,#E2B755,#D97706);
  --badge-text:#131720;
  --badge-muted-bg:#334155; --badge-muted-text:#CBD5E1;
  --composer-top:#151D2C; --composer-bot:#111826;
  --press:rgba(255,255,255,.05);
  --meta-out:#A9C4E8;
  --divider:rgba(255,255,255,.06);
  color:var(--ink-1);
}
/* ============ LIGHT TOKENS ============ */
.light{
  --canvas:#F5F7FA;
  --canvas-glow-a:rgba(217,119,6,.05);
  --canvas-glow-b:rgba(2,132,199,.04);
  --island-top:#FFFFFF; --island-bot:#FDFEFF;
  --card-top:#FFFFFF; --card-bot:#F4F7FB;
  --in-bubble:#FFFFFF;
  --out-top:#FAEFD3; --out-bot:#F2E0B4;
  --out-rim:rgba(180,125,20,.26);
  --in-rim:rgba(15,23,42,.07);
  --ink-1:#0F172A; --ink-2:#334155; --ink-3:#64748B; --ink-4:#94A3B8;
  --hairline:rgba(15,23,42,.07);
  --pill-bg:#EDF1F7;
  --pill-active-bg:#FDF0CE;
  --pill-active-border:rgba(217,119,6,.55);
  --pill-active-text:#B45309;
  --badge-bg:linear-gradient(135deg,#E39A28,#D97706);
  --badge-text:#FFFFFF;
  --badge-muted-bg:#CBD5E1; --badge-muted-text:#334155;
  --composer-top:#FFFFFF; --composer-bot:#FBFCFE;
  --press:rgba(15,23,42,.045);
  --meta-out:#97742F;
  --divider:rgba(15,23,42,.06);
  color:var(--ink-1);
}

.canvas-glow{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(420px 300px at 85% -5%, var(--canvas-glow-b), transparent 70%),
    radial-gradient(460px 340px at -10% 8%, var(--canvas-glow-a), transparent 70%);
}

/* ============ CHROME ============ */
.statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;position:relative;z-index:3;flex:none;}
.statusbar .time{font-size:14px;font-weight:700;letter-spacing:.01em;}
.statusbar .sicons{display:flex;align-items:center;gap:7px;color:var(--ink-2);}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:118px;height:4.5px;border-radius:3px;background:var(--ink-3);opacity:.55;z-index:9;}

.topbar{height:54px;display:flex;align-items:center;padding:0 10px 0 20px;position:relative;z-index:3;flex:none;}
.wordmark{font-size:21px;font-weight:800;letter-spacing:-.015em;color:var(--pill-active-text);}
.dark .wordmark{color:var(--gold);}
.topbar .spacer{flex:1;}
.topicon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);}
.topicon svg{width:21px;height:21px;}

/* filter pills */
.pills{display:flex;gap:8px;padding:6px 16px 12px;overflow:hidden;position:relative;z-index:3;flex:none;}
.pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:17px;
  background:var(--pill-bg);border:1px solid var(--hairline);
  font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;flex:none;}
.pill.active{background:var(--pill-active-bg);border-color:var(--pill-active-border);color:var(--pill-active-text);font-weight:700;}
.dark .pill.active{color:var(--gold);}
.pill .count{min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--badge-bg);color:var(--badge-text);
  font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}

/* ============ CHAT LIST ============ */
.list{flex:1;position:relative;z-index:2;padding:2px 8px 96px;overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:18px;}
.row.pinned{background:linear-gradient(90deg,var(--press),transparent 82%);}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:#F6F8FB;font-weight:700;font-size:17px;letter-spacing:.02em;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -6px 12px rgba(0,0,0,.22);}
.avatar::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.16);pointer-events:none;}
.light .avatar::after{border-color:rgba(15,23,42,.12);}
.av-steel{background:linear-gradient(145deg,#48688F,#2C4360);}
.av-bronze{background:linear-gradient(145deg,#96742F,#5F4919);}
.av-sage{background:linear-gradient(145deg,#69856A,#41573F);}
.av-mauve{background:linear-gradient(145deg,#82617A,#543F4F);}
.av-slate{background:linear-gradient(145deg,#556884,#37465C);}
.av-notes{background:linear-gradient(145deg,#E2B755,#B4832B);color:#131720;}
.light .av-notes{background:linear-gradient(145deg,#E2B755,#C08A2E);}
.av-group{border-radius:38%;}
.avatar .mini{position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;
  background:var(--card-top);display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  border:1px solid var(--hairline);}
.avatar .mini svg{width:11px;height:11px;}
.rmain{flex:1;min-width:0;}
.rline1{display:flex;align-items:center;gap:5px;}
.rname{font-size:15.5px;font-weight:700;letter-spacing:-.008em;color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.verified{color:var(--gold);flex:none;display:flex;}
.dark .verified{color:#C9A44C;}
.light .verified{color:#B45309;}
.verified svg{width:14.5px;height:14.5px;}
.pinmark{color:var(--ink-4);flex:none;display:flex;}
.pinmark svg{width:11px;height:11px;transform:rotate(35deg);}
.rtime{font-size:11.5px;font-weight:600;color:var(--ink-4);flex:none;margin-left:6px;}
.rtime.hot{color:var(--gold);}
.light .rtime.hot{color:#C98A12;}
.rline2{display:flex;align-items:center;gap:8px;margin-top:2.5px;min-height:21px;}
.rpreview{font-size:13.5px;font-weight:500;color:var(--ink-3);letter-spacing:-.004em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.rpreview .sender{color:var(--ink-2);font-weight:600;}
.rpreview .status-pending{color:#38BDF8;}
.light .rpreview .status-pending{color:#0284C7;}
.rpreview .draft-tag{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:5px;margin-right:6px;
  background:var(--pill-active-bg);border:1px solid var(--pill-active-border);color:var(--pill-active-text);
  font-size:10px;font-weight:800;letter-spacing:.03em;vertical-align:1px;}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;min-width:30px;}
.badge{min-width:21px;height:21px;padding:0 6.5px;border-radius:11px;background:var(--badge-bg);color:var(--badge-text);
  font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);}
.badge.muted{background:var(--badge-muted-bg);color:var(--badge-muted-text);box-shadow:none;}
.badge.at{min-width:21px;height:21px;padding:0 5px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--pill-active-bg);border:1px solid var(--pill-active-border);color:var(--pill-active-text);}
.badge.at svg{width:12px;height:12px;}
.rside .star{color:var(--ink-4);display:flex;}
.rside .star svg{width:15px;height:15px;}
.thumb{width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,#3E5E86,#22344C 55%,#54423A);
  box-shadow:inset 0 0 0 1px var(--hairline);}
.wave{display:flex;align-items:center;gap:2.5px;height:16px;}
.wave i{width:2.5px;border-radius:2px;background:var(--ink-3);display:block;}
.wave .t{font-size:11px;font-weight:600;color:var(--ink-4);margin-left:5px;}

/* island bar */
.island{position:absolute;left:20px;right:20px;bottom:22px;height:60px;border-radius:31px;z-index:8;
  background:linear-gradient(180deg,var(--island-top),var(--island-bot));
  box-shadow:0 12px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
  border:1px solid var(--hairline);
  display:flex;align-items:stretch;padding:5px;gap:4px;}
.light .island{box-shadow:0 12px 30px rgba(15,23,42,.14), inset 0 1px 0 #fff;}
.itab{flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5px;position:relative;
  color:var(--ink-3);font-size:10.5px;font-weight:600;}
.itab svg{width:19px;height:19px;}
.itab.active{background:linear-gradient(160deg,var(--pill-active-bg),transparent 130%);
  border:1px solid var(--pill-active-border);color:var(--pill-active-text);font-weight:800;}
.dark .itab.active{color:var(--gold);}
.itab .dot{position:absolute;top:7px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--badge-bg);color:var(--badge-text);font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;}

/* ============ CONVERSATION ============ */
.convtop{margin:6px 14px 4px;height:58px;border-radius:22px;flex:none;position:relative;z-index:4;
  background:linear-gradient(180deg,var(--island-top),var(--island-bot));
  border:1px solid var(--hairline);
  box-shadow:0 10px 26px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.09);
  display:flex;align-items:center;gap:10px;padding:0 8px 0 6px;}
.light .convtop{box-shadow:0 10px 24px rgba(15,23,42,.12), inset 0 1px 0 #fff;}
.convtop .back{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;}
.convtop .back svg{width:20px;height:20px;}
.convtop .cavatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#F6F8FB;font-size:13.5px;font-weight:700;position:relative;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28);}
.convtop .cavatar::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.16);}
.convtop .cinfo{flex:1;min-width:0;}
.convtop .cname{font-size:15.5px;font-weight:700;letter-spacing:-.008em;display:flex;align-items:center;gap:4px;color:var(--ink-1);}
.convtop .cstatus{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:1px;display:flex;align-items:center;gap:5px;}
.convtop .cstatus::before{content:"";width:6px;height:6px;border-radius:50%;background:#10B981;}
.convtop .cact{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex:none;}
.convtop .cact svg{width:19px;height:19px;}

.chat{flex:1;position:relative;z-index:2;overflow:hidden;padding:10px 14px 8px;display:flex;flex-direction:column;gap:2.5px;}
.datepill{align-self:center;margin:4px 0 8px;height:26px;padding:0 13px;border-radius:14px;
  background:var(--pill-bg);border:1px solid var(--hairline);
  font-size:11.5px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;letter-spacing:.02em;}
.msg{max-width:79%;padding:7px 11px 5.5px;border-radius:19px;position:relative;}
.msg.in{align-self:flex-start;background:var(--in-bubble);border:1px solid var(--in-rim);border-bottom-left-radius:7px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);color:var(--ink-1);}
.light .msg.in{box-shadow:0 2px 8px rgba(15,23,42,.06);}
.msg.out{align-self:flex-end;background:linear-gradient(165deg,var(--out-top),var(--out-bot));
  border:1px solid var(--out-rim);border-bottom-right-radius:7px;color:#F3F7FD;
  box-shadow:0 4px 14px rgba(30,53,87,.35);}
.light .msg.out{color:#2A2118;box-shadow:0 4px 12px rgba(180,125,20,.18);}
.msg .text{font-size:14px;line-height:1.42;font-weight:500;letter-spacing:-.004em;}
.msg .meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;
  font-size:10.5px;font-weight:600;color:var(--ink-4);height:14px;}
.msg.out .meta{color:var(--meta-out);}
.light .msg.out .meta{color:#97742F;}
.msg .meta svg{width:13px;height:13px;}
.msg .meta .checks{color:var(--gold);}
.light .msg.out .meta .checks{color:#C98A12;}
.quote{border-left:3px solid var(--gold);border-radius:8px;background:rgba(255,255,255,.06);
  padding:5px 9px 6px;margin-bottom:5px;}
.light .quote{background:rgba(15,23,42,.05);}
.quote .qname{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:1px;}
.light .quote .qname{color:#B45309;}
.quote .qtext{font-size:12.5px;font-weight:500;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;}
.voice{display:flex;align-items:center;gap:9px;padding:3px 2px;}
.voice .play{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#E2B755,#C08A2E);color:#131720;box-shadow:0 3px 8px rgba(0,0,0,.3);}
.voice .play svg{width:15px;height:15px;margin-left:1.5px;}
.voice .vw{display:flex;align-items:center;gap:2.5px;height:20px;}
.voice .vw i{width:2.5px;border-radius:2px;background:var(--ink-3);display:block;}
.voice .vt{font-size:10.5px;font-weight:600;color:var(--ink-4);}
.pic{width:218px;height:140px;border-radius:14px;overflow:hidden;position:relative;margin:-1px -3px 2px;
  background:linear-gradient(150deg,#8FA6C4 0%,#5C7699 38%,#2E4258 68%,#4A3A33 100%);}
.pic::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:14px;}
.reaction{position:absolute;bottom:-11px;display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:13px;
  background:var(--card-top);border:1px solid var(--pill-active-border);
  font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,.3);}
.msg.in .reaction{left:10px;}
.reaction .rcount{font-size:10.5px;font-weight:800;color:var(--ink-2);}
.typing{position:absolute;left:18px;bottom:86px;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;
  border-radius:18px;background:var(--in-bubble);border:1px solid var(--in-rim);z-index:5;
  box-shadow:0 4px 12px rgba(0,0,0,.25);}
.typing .tdots{display:flex;gap:3.5px;}
.typing .tdots i{width:5.5px;height:5.5px;border-radius:50%;background:var(--ink-3);animation:td 1.2s infinite;}
.typing .tdots i:nth-child(2){animation-delay:.18s;}
.typing .tdots i:nth-child(3){animation-delay:.36s;}
@keyframes td{0%,60%,100%{opacity:.35;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
.typing .tlabel{font-size:12px;font-weight:600;color:var(--ink-3);}

.composer{margin:6px 14px 30px;min-height:56px;border-radius:26px;flex:none;position:relative;z-index:6;
  background:linear-gradient(180deg,var(--composer-top),var(--composer-bot));
  border:1px solid var(--hairline);
  box-shadow:0 12px 30px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.10);
  display:flex;align-items:center;gap:8px;padding:7px;}
.light .composer{box-shadow:0 12px 26px rgba(15,23,42,.13), inset 0 1px 0 #fff;}
.cdisc{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;}
.cdisc svg{width:19px;height:19px;}
.cdisc.attach{background:var(--pill-active-bg);border:1px solid var(--pill-active-border);color:var(--pill-active-text);}
.dark .cdisc.attach{color:var(--gold);}
.cdisc.send{background:linear-gradient(150deg,#F0C96C,#D9A033);color:var(--on-gold);
  box-shadow:0 4px 14px rgba(226,183,85,.35), inset 0 1px 0 rgba(255,255,255,.5);}
.cdisc.send svg{width:18px;height:18px;margin-left:2px;}
.cinput{flex:1;font-size:14.5px;font-weight:500;color:var(--ink-1);white-space:nowrap;overflow:hidden;}
.cinput .caret{display:inline-block;width:2px;height:17px;background:var(--gold);vertical-align:-3px;margin-left:1px;animation:caret 1.1s steps(1) infinite;}
@keyframes caret{50%{opacity:0;}}
</style>
</head>
<body>
<div class="board-title">SimpleUX · Luxury Mineral v2</div>
<div class="board-sub">Core screens · chat list + conversation · obsidian / platinum</div>
<div class="board">

<!-- ============ 1 · CHAT LIST · DARK ============ -->
<figure class="device">
<div class="screen dark">
  <div class="canvas-glow"></div>
  <div class="statusbar"><span class="time">9:41</span>
    <span class="sicons">
      <svg viewBox="0 0 16 12" width="15" height="11" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.3" y="5" width="3" height="7" rx="1"/><rect x="8.6" y="3" width="3" height="9" rx="1"/><rect x="12.9" y="1" width="3" height="11" rx="1" opacity=".4"/></svg>
      <svg viewBox="0 0 16 12" width="15" height="11" fill="currentColor"><path d="M8 9.5a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2z" transform="translate(0,-1.6)"/><path d="M2.6 5.4a7.6 7.6 0 0110.8 0l-1.5 1.5a5.5 5.5 0 00-7.8 0z"/><path d="M.2 3a11 11 0 0115.6 0l-1.5 1.5a8.9 8.9 0 00-12.6 0z" opacity=".99"/></svg>
      <svg viewBox="0 0 25 12" width="23" height="11"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><rect x="22.8" y="3.8" width="2" height="4.4" rx="1" fill="currentColor" opacity=".45"/></svg>
    </span>
  </div>
  <div class="topbar">
    <span class="wordmark">SimpleUX</span>
    <span class="spacer"></span>
    <span class="topicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg></span>
    <span class="topicon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></span>
  </div>
