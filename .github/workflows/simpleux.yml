name: simpleux-frontend

# CI for the SimpleUX fork layer (Kotlin/Compose Android), which build.yml does
# not cover. Android-only by scope (issue #100): the desktop compile/test gates
# stay local; this workflow validates what we actually ship.

on:
  push:
    branches:
      - claude/**
      - main
      - stable
  pull_request:
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/simpleux.yml"

concurrency:
  group: simpleux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile Android Kotlin + lint guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # nanohttpd is built from this submodule since upstream #7396
          # (replaces the dead JitPack commit-artifact dependency)
          submodules: recursive

      - name: Set up JDK 21 (LTS - same toolchain as the local dev gate, AGENTS.md §6)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Dependencies + Gradle build cache: `--build-cache` below feeds
      # ~/.gradle/caches/build-cache-1, so consecutive runs only recompile
      # what changed instead of the whole Kotlin tree (issue #100).
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/multiplatform/**/*.gradle.kts', 'apps/multiplatform/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Note: this intentionally stops at Kotlin compilation, not a full APK.
      # apps/multiplatform's Android variant links against libsimplex.so /
      # libsupport.so, which come from a separate Nix cross-build of the
      # Haskell core (scripts/android/build-android.sh) - not available here
      # and not needed to validate a Kotlin/Compose-only change. Full APK
      # assembly (with upstream's precompiled native libs substituted in) is
      # what simpleux-release.yml does on every push to stable.
      - name: Compile Android Kotlin (common + android source sets)
        working-directory: apps/multiplatform
        run: ./gradlew :common:compileDebugKotlinAndroid --build-cache --stacktrace

      - name: Lint guardrails (no raw hex colors, no untranslated literals, no ChatModel singleton defaults in views/ux)
        working-directory: apps/multiplatform/common/src/commonMain/kotlin/chat/simplex/common/views/ux
        run: |
          set -e
          echo "Checking for raw 0xFF hex colors outside ui/theme tokens..."
          # Baseline of files that already had raw hex literals before this lint existed
          # (tracked by issue #16 / #15 - the design-token consolidation). This list must
          # only ever shrink as those files get tokenized, never grow: any *new* file, or
          # any file not on this list, is held to the real rule with no exceptions.
          hex_baseline=(
            "./ChatListShell.kt"
            "./components/ActiveContactsRail.kt"
            "./components/DisappearingTimerBar.kt"
            "./components/FilterPillsRow.kt"
            "./components/FullscreenEmojiEffectOverlay.kt"
            "./components/MessageBubble.kt"
            "./components/MineralPullToRefreshIndicator.kt"
            "./components/ProfileSwitcherOverlay.kt"
            "./components/QuickReactionsBar.kt"
            "./components/QuickRepliesBar.kt"
            "./components/SecurityBadge.kt"
            "./components/SwipeableChatCard.kt"
            "./components/ThemeAnimation.kt"
            "./components/VoiceWaveformPlayer.kt"
            "./modals/QuickProfileSwitcher.kt"
            "./modals/ServerRadarSheet.kt"
            "./modals/ZeroJargonOnboarding.kt"
          )
          exclude_args=()
          for f in "${hex_baseline[@]}"; do
            exclude_args+=(--exclude="$(basename "$f")")
          done
          offenders=$(grep -rEln "0x[0-9A-Fa-f]{6,8}" "${exclude_args[@]}" . || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::Raw hex color literals found in views/ux/ outside the tracked baseline. Use theme tokens from ui/theme instead."
            exit 1
          fi
          echo "Checking for ChatModel singleton defaults..."
          # Same deal as the hex baseline above: tracked by issue #09, must only shrink.
          chatmodel_baseline=(
            "./components/SwipeableChatCard.kt"
            "./components/FilterPillsRow.kt"
            "./modals/QuickProfileSwitcher.kt"
          )
          exclude_args=(--exclude="README.md")
          for f in "${chatmodel_baseline[@]}"; do
            exclude_args+=(--exclude="$(basename "$f")")
          done
          offenders=$(grep -rn "= ChatModel\b" "${exclude_args[@]}" . || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::Default-parameter binding to the ChatModel singleton found outside the tracked baseline. Inject explicitly instead (see views/ux/README.md, issue #09)."
            exit 1
          fi
          echo "Checking issue #58 non-regression guards..."
          # Issue #58 (mid-screen band eating list rows): AnimatedContent in the tab host
          # retained a raster layer that composited a background-colored hole across the
          # viewport center. Root-caused and removed 2026-08-29; do not re-introduce it in
          # the shell (repro + bisect trail on the issue).
          if grep -Eq "AnimatedContent[[:space:]]*\(" ./ChatListShell.kt; then
            echo "::error::AnimatedContent found in ChatListShell.kt - it caused the issue #58 viewport hole (background-colored band eating list rows). Do not re-add it to the tab host."
            exit 1
          fi
          # The directory section must stay split into per-group lazy items (directorySearchItems):
          # a single item taller than the viewport was the second half of the #58 rendering hazard.
          if ! grep -q "directorySearchItems(" ../chatlist/ChatListContent.kt ../newchat/NewChatSheet.kt 2>/dev/null; then
            echo "::error::directorySearchItems call sites missing - the directory search section must be emitted as per-group lazy items (issue #58)."
            exit 1
          fi
          echo "OK"

  # AGENTS.md (2026-08-28 rewrite) §3/§4 enforcement: the rules that can be
  # checked mechanically are checked here, on every push and PR. Keep each
  # check cheap and its failure message self-explanatory.
  truth-check:
    name: Truth checks (model layer frozen, migration gates reachable, no new French literals)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history - base-SHA diffs need it)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine base revision for diff checks
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
          fi
          if [ -n "$BASE" ] && ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::warning::Base revision $BASE not present locally; diff checks will skip."
            BASE=""
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diffing against: ${BASE:-<none>}"

      # AGENTS.md §1: the model layer is byte-frozen. Update FORK_BASE only
      # when deliberately rebasing onto a new upstream base - never to make a
      # failing check pass.
      - name: Model layer is byte-frozen (SimpleXAPI.kt)
        run: |
          FORK_BASE=abd595467
          API=apps/multiplatform/common/src/commonMain/kotlin/chat/simplex/common/model/SimpleXAPI.kt
          if git diff --quiet $FORK_BASE HEAD -- "$API"; then
            echo "SimpleXAPI.kt is byte-identical to the fork base ($FORK_BASE)."
          else
            git diff $FORK_BASE HEAD -- "$API"
            echo "::error::SimpleXAPI.kt diverged from the fork base. The model layer is frozen (AGENTS.md §1): UI preference defaults change in the UI layer, not here. See issues #05 / #60."
            exit 1
          fi

      # AGENTS.md §4: a migration gate `lastMigration < N` only runs for
      # users whose stored version is below N. Adding such a gate while the
      # version_code at the base is already >= N means every existing user
      # skips it - the dead migration wave-3 nearly shipped (#60). Adding a
      # gate in the release where version_code first reaches N is fine
      # (upstream's own release pattern).
      - name: Migration gates are reachable (no new gate under an already-shipped version_code)
        run: |
          BASE="${{ steps.base.outputs.base }}"
          if [ -z "$BASE" ]; then echo "No base revision; skipping."; exit 0; fi
          ADDED_N=$(git diff "$BASE" HEAD --unified=0 --diff-filter=AM -- apps/multiplatform/common/src \
            | grep -E '^\+[^+]' | grep -oE 'lastMigration\.get\(\) *< *[0-9]+' \
            | grep -oE '[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$ADDED_N" ]; then
            echo "No migration gates added; nothing to check."
            exit 0
          fi
          BASE_VC=$(git show "$BASE":apps/multiplatform/gradle.properties | grep -oE '^android\.version_code=[0-9]+' | cut -d= -f2)
          HEAD_VC=$(git show HEAD:apps/multiplatform/gradle.properties | grep -oE '^android\.version_code=[0-9]+' | cut -d= -f2)
          echo "Added gate '< $ADDED_N' ; version_code $BASE_VC -> $HEAD_VC"
          if [ -n "$BASE_VC" ] && [ "$BASE_VC" -ge "$ADDED_N" ]; then
            echo "::error::Dead migration: gate '< $ADDED_N' added while version_code was already $BASE_VC at the base - existing users will never run it. Bump version_code and gate above the previously shipped value. See #60 and AGENTS.md §4."
            exit 1
          fi

      # AGENTS.md §3/§5: user-visible strings go through MR.strings. Heuristic
      # net over ADDED lines only (existing literals are tracked in #19 and
      # must shrink): accented characters or known French UI words. Not
      # exhaustive - the honest fix is MR.strings.
      - name: No new hardcoded French literals in Kotlin
        run: |
          BASE="${{ steps.base.outputs.base }}"
          if [ -z "$BASE" ]; then echo "No base revision; skipping."; exit 0; fi
          git diff "$BASE" HEAD --unified=0 --diff-filter=AM -- apps/multiplatform/common/src/commonMain/kotlin > /tmp/added.diff || true
          # strip diff headers, the leading '+', and comments (whole-line and trailing)
          ADDED=$(grep -E '^\+[^+]' /tmp/added.diff | sed -e 's/^+//' -e 's|//.*$||' | grep -v '^[[:space:]]*$' || true)
          if [ -z "$ADDED" ]; then
            echo "No added Kotlin lines to check."
            exit 0
          fi
          # 1) accented characters anywhere in added code lines
          HITS=$(printf '%s\n' "$ADDED" | grep -E '[àâäçéèêëîïôöùûüÿœÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŒ]' || true)
          # 2) unaccented French UI words inside string literals
          if [ -z "$HITS" ]; then
            HITS=$(printf '%s\n' "$ADDED" | grep -E '"[^"]*\b(Non lus|Brouillon|Nouveau profil|Annuaire|Groupe public|Bot officiel|X membres|Mode Clair|Mode Sombre)\b[^"]*"' || true)
          fi
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Added lines look like hardcoded French literals. User-visible strings go through MR.strings (AGENTS.md §5, issue #19). If a hit is a false positive, rephrase it or move the string to MR."
            exit 1
          fi
          echo "OK"
