name: simpleux-frontend

# CI for the SimpleUX fork layer (Kotlin/Compose), which build.yml does not cover:
# build.yml's pull_request paths filter never matches apps/multiplatform/**, so
# every fork change was previously merged with zero build/test verification.

on:
  push:
    branches:
      - claude/**
      - main
  pull_request:
    paths:
      - "apps/multiplatform/**"
      - ".github/workflows/simpleux.yml"

concurrency:
  group: simpleux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile Kotlin (desktop + Android) + desktop tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/multiplatform/**/*.gradle.kts', 'apps/multiplatform/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Note: this intentionally stops at Kotlin compilation, not a full APK.
      # apps/multiplatform's Android variant links against libsimplex.so /
      # libsupport.so, which come from a separate Nix cross-build of the
      # Haskell core (scripts/android/build-android.sh) — not available here
      # and not needed to validate a Kotlin/Compose-only change. Full APK
      # assembly (with upstream's precompiled native libs substituted in) is
      # what android-quick-apk.yml is for, on demand.
      - name: Compile Android Kotlin (common + android source sets)
        working-directory: apps/multiplatform
        run: ./gradlew :common:compileDebugKotlinAndroid --stacktrace

      - name: Compile desktop Kotlin
        working-directory: apps/multiplatform
        run: ./gradlew :common:compileKotlinDesktop --stacktrace

      - name: Run desktop/common tests
        working-directory: apps/multiplatform
        run: ./gradlew desktopTest --stacktrace

      - name: Lint guardrails (no raw hex colors, no untranslated literals, no ChatModel singleton defaults in views/ux)
        working-directory: apps/multiplatform/common/src/commonMain/kotlin/chat/simplex/common/views/ux
        run: |
          set -e
          echo "Checking for raw 0xFF hex colors outside ui/theme tokens..."
          if grep -rEn "0x[0-9A-Fa-f]{6,8}" . ; then
            echo "::error::Raw hex color literals found in views/ux/. Use theme tokens from ui/theme instead."
            exit 1
          fi
          echo "Checking for ChatModel singleton defaults..."
          if grep -rn "= ChatModel\b" . ; then
            echo "::error::Default-parameter binding to the ChatModel singleton found. Inject explicitly instead (see views/ux/README.md)."
            exit 1
          fi
          echo "OK"
